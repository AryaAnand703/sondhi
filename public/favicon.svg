<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Vignette -->
    <radialGradient id="bg-grad" cx="50%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#221D19" />
      <stop offset="70%" stop-color="#14110F" />
      <stop offset="100%" stop-color="#0B0908" />
    </radialGradient>

    <!-- Molten Gold Gradient for Ring -->
    <linearGradient id="gold-ring" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="25%" stop-color="#FFF3B0" />
      <stop offset="50%" stop-color="#B88628" />
      <stop offset="75%" stop-color="#F3CE65" />
      <stop offset="100%" stop-color="#8C5C12" />
    </linearGradient>

    <!-- Molten Gold Gradient for S-Monogram -->
    <linearGradient id="gold-s" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="20%" stop-color="#FCD34D" />
      <stop offset="45%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="90%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Radiant Candle Flame Gradient -->
    <linearGradient id="flame-outer" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FEF08A" />
      <stop offset="55%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Flame Core Luminosity -->
    <radialGradient id="flame-core" cx="50%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FFFBEB" />
      <stop offset="75%" stop-color="#FEF08A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>

    <!-- Warm Atmospheric Glow -->
    <filter id="flame-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Atelier Medallion -->
  <circle cx="256" cy="256" r="244" fill="url(#bg-grad)" />

  <!-- Outer Fine Gold Rim -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#gold-ring)" stroke-width="7" />
  <circle cx="256" cy="256" r="226" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- Ambient Flame Hearth Glow -->
  <circle cx="256" cy="245" r="95" fill="#F59E0B" opacity="0.12" filter="url(#flame-glow)" />

  <!-- SONDHI Artisanal Mark: Flame & S Monogram -->
  <g filter="url(#soft-glow)">
    <!-- Top Flame Teardrop Silhouette -->
    <path d="M 256 78 
             C 278 126, 304 166, 290 208 
             C 280 238, 258 248, 256 248 
             C 254 248, 232 238, 222 208 
             C 208 166, 234 126, 256 78 Z" 
          fill="url(#flame-outer)" />

    <!-- Radiant Inner Core Teardrop -->
    <path d="M 256 122 
             C 268 152, 280 180, 274 204 
             C 268 226, 258 234, 256 234 
             C 254 234, 244 226, 238 204 
             C 232 180, 244 152, 256 122 Z" 
          fill="url(#flame-core)" />

    <!-- Serif Flick on Upper Right -->
    <path d="M 292 208
             C 305 212, 320 205, 332 196
             C 328 214, 326 232, 328 248
             C 318 240, 308 236, 296 232
             Z"
          fill="url(#gold-s)" />

    <!-- Main Serpentine 'S' Ribbon Spine -->
    <path d="M 226 195
             C 208 220, 192 245, 192 278
             C 192 322, 224 348, 256 364
             C 292 382, 326 400, 326 432
             C 326 462, 298 482, 256 482
             C 214 482, 186 458, 184 425
             C 184 410, 194 402, 204 402
             C 216 402, 224 412, 224 424
             C 224 445, 238 458, 258 458
             C 284 458, 300 442, 300 424
             C 300 398, 270 380, 236 362
             C 198 342, 168 316, 168 274
             C 168 234, 196 205, 226 195 Z"
          fill="url(#gold-s)" opacity="0.95" />

    <!-- Elegant Inner Swirl & Accent Contour -->
    <path d="M 256 248
             C 282 280, 318 316, 334 358
             C 346 390, 342 422, 324 444
             C 334 426, 338 402, 330 376
             C 318 338, 286 304, 260 274
             C 246 258, 238 242, 236 228
             C 242 238, 248 244, 256 248 Z"
          fill="url(#flame-outer)" opacity="0.85" />

    <!-- Subtle Golden Ember at Heart -->
    <circle cx="256" cy="400" r="10" fill="url(#flame-outer)" opacity="0.9" filter="url(#soft-glow)" />
  </g>
</svg>
